name: Build app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: duyenhoang-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: mkdir -p www && echo '<!doctype html><meta charset="utf-8"><title>Duyen Hoang</title>' > www/index.html
      - run: npm install
      - run: npm install
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build khong ky (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../duyenhoang-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: duyenhoang-ipa
          path: duyenhoang-unsigned.ipa
